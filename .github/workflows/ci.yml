name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm test
      - run: npm pack --dry-run

  java:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [8, 11, 17, 21, 25]
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn -B -ntp clean verify

  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: scripts/generate_checksums.sh
      - run: git diff --exit-code -- checksums.sha256
      - run: python -m py_compile scripts/update_lists.py
      - run: bash -n scripts/download_hibp.sh
      - run: python scripts/update_lists.py --input-dir data/source --ref 2026.1
      - run: cmp data/generated/frontend-blocklist.txt frontend/public/passwords/frontend-blocklist.txt
      - run: cmp data/generated/backend-blocklist.txt java/src/main/resources/weak-passwords/backend-blocklist.txt
